<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, rgba(20,20,35,0.95) 0%, rgba(10,10,18,0.98) 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      border-radius: 16px;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      z-index: 2;
    }
    .glow {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.4) 0%, rgba(124, 58, 237, 0) 70%);
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
      z-index: 1;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .loader {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 2px;
      animation: progress-load 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.8; }
      100% { transform: scale(0.9); opacity: 0.5; }
    }
    @keyframes progress-load {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 40%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="glow"></div>
    <img class="logo" src="../public/icon.png" alt="Logo" onerror="this.style.display='none'">
  </div>
  <div class="title">DayFllow</div>
  <div class="subtitle">PREMIUM WORKSPACE</div>
  <div class="loader">
    <div class="progress"></div>
  </div>
</body>
</html>
