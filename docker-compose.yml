# Local development stack: Postgres, Redis, the API, and the built SPA.
#
#   cp backend/.env.example backend/.env    # then fill in the values
#   docker compose up --build
#
# The API is on http://localhost:8000 and the app on http://localhost:8080.
# For production, see docs/DEPLOYMENT.md -- this file is not a production
# deployment: it uses a development password and exposes Postgres on the host.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dayflow
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow-local-dev-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # These override .env so the container talks to the compose services
      # rather than to whatever the developer has on localhost.
      DATABASE_URL: postgres://dayflow:dayflow-local-dev-only@db:5432/dayflow
      DJANGO_DB_SSL_REQUIRE: "false"
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:8080
      DJANGO_SECURE_SSL_REDIRECT: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py seed_plans &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
        VITE_WS_URL: ws://localhost:8000/ws/updates/
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
